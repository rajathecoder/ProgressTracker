name: arccore
description: "Happy Days - Winter Arc & RPG Stat Tracker. A fully offline, claymorphic habit tracker that turns an arc into a character sheet."
publish_to: 'none'
version: 1.3.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (maintained community fork of Isar - the original
  # `isar` 3.1.0+1 generator does not build against analyzer 8.x / Dart 3.11)
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  # Storage & preferences
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.6
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Motion & celebration
  lottie: ^3.3.3
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  audioplayers: ^6.7.1

  # Localization
  intl: ^0.20.2

  # Charts
  fl_chart: ^1.2.0

  # Sensors
  pedometer: ^4.2.0

  # Platform integration
  home_widget: ^0.9.3
  workmanager: ^0.10.9
  local_auth: ^3.0.2
  permission_handler: ^12.0.3
  share_plus: ^13.3.0
  screenshot: ^3.0.0
  file_picker: ^12.1.3
  image_picker: ^1.2.3
  flutter_displaymode: ^0.7.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

  # Interaction
  flutter_slidable: ^4.0.3
  animated_notch_bottom_bar: ^1.0.4

  # Data integrity
  csv: ^8.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ">=2.4.0 <2.15.0"
  isar_community_generator: ^3.3.2
  image: ^4.5.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
    - assets/lottie/
    - assets/icons/
    - assets/brand/
